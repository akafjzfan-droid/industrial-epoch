blackstart.nativeFusion.title = 原版融合
blackstart.nativeFusion.intro = 默认启用标准融合，旧存档缺少模式设置时也按标准模式运行。兼容模式恢复原版机组出力与此前的理想频率参考。设置与新存档续接记录属于当前世界；非活动战区的离线生产仍沿用原版。
blackstart.nativeFusion.startup = 实际出力按下方各类型的启动规律接入，保留原生更慢的反应堆暖机。RTG直接随燃料库存出力，太阳能逆变接入为1秒。新完整存档返回时续接合法进度；没有记录的旧档、新建和真实停机仍须启动。重新开启适配会冷启动；切回兼容立即生效。数值尚未完成平衡校准。
blackstart.nativeFusion.resources = 原有燃料、液体、热源、冷却、保护与玩家开关仍然有效。启动因子不会增加原版可用出力。每类机组可分别关闭适配；混合电网中的模组机组在自动档补足原版供电缺口，手动出力仍由玩家设定。
blackstart.nativeFusion.frequency = 等值频率来自受实际供给约束的电网模型，不是原版实测频率。房主快照缺失或过期时显示不可用。客户端设备值为本端估计，启动因子显示不可用。
blackstart.nativeFusion.limits = 标准模式适配14类原版发电机，保留原有资源条件与危险。原版线路在分区面板手动分合；自动调度与保护沿用模组入线。普通、高压、特高压工程链路有各自容量与损耗，电压和无功潮流仍为简化模型。
