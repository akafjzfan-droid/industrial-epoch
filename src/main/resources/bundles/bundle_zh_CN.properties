blackstart.fusion.title = 原版混合基地演示
blackstart.fusion.intro = 在沙盒40乘26格的干燥空地生成演示。现有模组设备向原版合金冶炼厂和独立的修理支路供电。煤与生产原料有限，不会自动保存世界。
blackstart.fusion.steps = 1. 定位并启动起动机组，等待启动完成；出力目标已预设。\n2. 合上右侧两个支路断路器，观察合金产出与墙体修复。\n3. 断开上方工厂断路器，保持下方防御断路器合闸；确认工厂停产时防御仍能修复。墙体若已修满，可用下方按钮重新制造损伤，再观察。\n4. 重新合上工厂断路器，确认恢复生产。若因物料停产，请补料或取走产物。\n两条支路分别使用独立的原版电网；开关控制整条支路，不能对同网建筑逐栋甩负荷。
