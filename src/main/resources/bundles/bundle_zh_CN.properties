block.blackstart-high-voltage-node.name = 高压输电节点
block.blackstart-high-voltage-node.description = 高压等级：每条源侧链路9000电力/秒，受控跨距60格，默认每跳损耗1.5%。最多六条出线共同分配所在电网的真实可用电力。受电端接工程节点或保护装置；直接点选机器仍为本地连接记录。端点抽象为变电接口，尚非电压潮流求解。
block.blackstart-ultra-voltage-node.name = 特高压输电节点
block.blackstart-ultra-voltage-node.description = 特高压等级：每条源侧链路36000电力/秒，受控跨距120格，默认每跳损耗0.8%。最多六条出线共同分配真实电源预算，受电端接工程节点或保护装置。材料成本更高；沿用限流和断路器，不新增烧线。等级体现容量、跨距与损耗。

