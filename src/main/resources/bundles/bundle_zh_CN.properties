blackstart.training.action.5 = 主机目标先调至20%，即720电力/秒，起动机保持20%。观察有差调节与稳定过程，调整目标或负荷，直到联络许可连续稳定1秒。
blackstart.training.action.6 = 合上远端断路器，确认两侧成为同一岛。完成数记录本次成功过程；此后仍应继续观察当前供电。
