blackstart.training.action.0 = 在小机组面板点击启动，利用预置煤起动；它不需外部辅助电，等待3秒。
blackstart.training.action.1 = 确认起动电源已建立动态频率参考，远端兼容电网此时仍保持隔离。
blackstart.training.action.2 = 将起动机组目标提高至20%，即120电力/秒，再启动主机；持续保持辅助供电。
blackstart.training.action.3 = 连续提供120电力/秒辅助电8秒。中途失电会重新计时。
blackstart.training.action.4 = 主机运行后将其目标设为20%。先将一台负荷箱设为120，合上负荷侧断路器；每隔4秒依次将另一台设为120、第一台增至360、第二台增至360。空电池已从起动电源充电，为辅助供电缓冲。观察负荷箱实际供电率；旧链路有死区，已带载不代表满供。6000档可试带载过多，2000档可试联络容量不足。
