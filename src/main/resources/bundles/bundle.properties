blackstart.panel.fusion = Mixed-base drill
blackstart.fusion.title = Mixed-base power drill
blackstart.fusion.intro = Create a 40 by 26 sandbox scene on empty dry land. Existing mod equipment supplies a native surge smelter and a separate repair branch. Coal and factory inputs are finite; no world is saved automatically.
blackstart.fusion.steps = 1. Locate and start the starter generator; wait for startup. Its target is preset.\n2. Close the two branch circuit breakers on the right. Observe alloy output and wall repair.\n3. Open the upper factory breaker, leaving the lower defense breaker closed. Check that production stops while repairs continue. If the wall is fully repaired, use the damage button below to repeat the observation.\n4. Close the factory breaker again and verify production resumes. Add ingredients or remove output if the factory stops for material reasons.\nEach branch has its own native grid. These switches control branches, not individual buildings sharing one grid.
