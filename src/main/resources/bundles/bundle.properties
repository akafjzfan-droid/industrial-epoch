blackstart.training.created = Exercise created. Start with the independent starter generator.
blackstart.training.noSpace = No empty 48 by 18 dry area found. Use a larger blank sandbox map.
blackstart.training.step.0 = 1. Start an independent power source
blackstart.training.step.1 = 2. Establish a live island
blackstart.training.step.2 = 3. Restore the required auxiliary supply
blackstart.training.step.3 = 4. Start the main machine
blackstart.training.step.4 = 5. Add loads in separate batches
blackstart.training.step.5 = 6. Meet the synchronism conditions
blackstart.training.step.6 = 7. Restore the interconnection
blackstart.training.action.0 = Start the small machine using its coal. It needs no external auxiliary power; wait 3 seconds.
blackstart.training.action.1 = Check that the new source has established a dynamic frequency reference. The remote compatibility grid remains isolated.
blackstart.training.action.2 = Set the starter dispatch to 20 percent (120 power/s), then start the main machine. Keep auxiliary power available continuously.
blackstart.training.action.3 = Maintain 120 power/s of auxiliary supply for 8 seconds. Interrupted startup restarts the timer.
blackstart.training.action.4 = Once the main machine runs, set its dispatch to 20 percent. Set the first bank to 120 and close the load feeder. At 4-second intervals, set the second to 120, raise the first to 360, then the second to 360. The initially empty battery charges from the starter to buffer auxiliary supply. Check actual delivery on each bank: the inherited link deadband means a powered batch need not be fully supplied. Try 6000 for excess load or 2000 for insufficient link capacity.
blackstart.training.delivery = Delivered %.0f / %.0f power/s (%.1f%%)
blackstart.event.sync_reject = Synchronism rejected
blackstart.explain.syncMeasured = Local frequency %s Hz; %s
blackstart.training.action.5 = Set main dispatch near 20 percent (720 power/s), keeping starter dispatch at 20 percent. Observe droop and settling; adjust dispatch or load until the intertie permits closing for a full second.
blackstart.training.action.6 = Close the remote circuit breaker. Verify the two sides share an island. The completed count records the successful exercise; continue monitoring current conditions.
