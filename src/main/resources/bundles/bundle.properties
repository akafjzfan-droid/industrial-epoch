block.blackstart-high-voltage-node.name = High-voltage transmission node
block.blackstart-high-voltage-node.description = High-voltage grade: 9000 power/s per source line, 60-tile managed span, default 1.5% loss. Six outgoing links share their real grid's available power. Connect to an engineering node or protection device at the receiving grid; direct machine links remain local connection records. Grades abstract substation interfaces, not a voltage-flow solver.
block.blackstart-ultra-voltage-node.name = Ultra-high-voltage transmission node
block.blackstart-ultra-voltage-node.description = Ultra-high-voltage grade: 36000 power/s per source line, 120-tile managed span, default 0.8% loss. Six outgoing links share their real grid's available power. Connect to a receiving engineering node or protection device. Uses costly materials; no automatic wire burnout. Grades model transfer capacity, range and loss.

