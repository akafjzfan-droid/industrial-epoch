blackstart.nativeFusion.title = Native fusion
blackstart.nativeFusion.intro = Standard fusion is enabled by default, including older saves without a mode setting. Compatibility restores native generator output and the earlier ideal frequency reference. Settings and new save continuity records belong to this world; offline production still follows the native campaign.
blackstart.nativeFusion.startup = Actual output follows the type-specific starts listed below. Native slower reactor warmup remains. RTG follows fuel inventory directly; solar uses a 1s inverter connection. New full saves resume valid progress on return; older saves without a record, new construction and real stops still start cold. Re-enabling adaptation starts cold. Compatibility takes effect immediately. Values are not yet balance-tuned.
blackstart.nativeFusion.resources = Original fuel, liquids, heat, cooling, protection and player switches still apply. Startup factors never increase native output. Each generator type can be disabled independently. Automatic mod generators cover the remaining load in mixed grids; manual dispatch stays under player control.
blackstart.nativeFusion.frequency = Equivalent frequency is a supply-constrained grid model, not a measured native frequency. Missing or expired host snapshots show unavailable. Client device values are local estimates; startup factor is unavailable on clients.
blackstart.nativeFusion.limits = Standard mode adapts 14 native generator types while preserving their original resources and hazards. Native lines use the manual zone panel; automatic dispatch/protection uses mod incoming lines. Ordinary, high-voltage and ultra-high-voltage engineering lines have distinct capacities and losses; voltage and reactive flow are still simplified.
