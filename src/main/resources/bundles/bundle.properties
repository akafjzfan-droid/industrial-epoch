blackstart.training.title = Black-start exercise
blackstart.training.loadHelp = Demand in power/s. 2000 tests line capacity; 6000 tests source capacity.
blackstart.training.intro = Create a real exercise in an empty 48 by 18 sandbox area. No base is overwritten and no save file is written. Ten pieces of coal are provided to each machine. Use the configuration panels to operate the equipment.
blackstart.training.noScene = No exercise in this world
blackstart.training.wait = Waiting for a valid scene observation; check that the exercise devices still exist
blackstart.training.progress = Completed %d/7 · origin (%d,%d)
blackstart.training.conditions = Auxiliary %.0f/%.0f · load %.0f · available %.0f · line %.0f power/s · batches %d
